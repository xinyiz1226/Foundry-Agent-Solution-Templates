[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "information-extraction"
version = "0.1.0"
description = "Offline G0 deterministic extraction execution core"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
workbench = [
    "streamlit>=1.40,<2",
    "httpx>=0.28.1,<1",
]
test = [
    "httpx>=0.28.1,<1",
    "setuptools>=77",
]
hosted = [
    "azure-ai-agentserver-core[hosted]==2.1.0",
    "azure-ai-agentserver-invocations==1.1.0",
    "azure-identity>=1.25.0,<2",
    "azure-storage-blob>=12.30,<13",
]
azure = [
    "azure-ai-projects>=2.3.0,<3",
    "azure-identity>=1.25.0,<2",
    "azure-storage-blob>=12.30,<13",
    "openai>=2.54.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["information_extraction*"]
